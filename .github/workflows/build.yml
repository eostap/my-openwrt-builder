name: Build luci-app-xray APK (Safe Checkout)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Официальный экшен клонирует целевой репозиторий напрямую через внутреннее API
      - name: Checkout luci-app-xray Source
        uses: actions/checkout@v4
        with:
          repository: 'yichya/luci-app-xray'
          ref: 'main'
          path: 'source'

      - name: Install APK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y abuild apk-tools

      - name: Prepare APK Structure
        run: |
          # Создаем базовую структуру папок
          mkdir -p apk_root/usr/share/luci/menu.d
          mkdir -p apk_root/usr/share/rpcd/acl.d
          mkdir -p apk_root/www/luci-static/resources/view

          # Копируем JS-интерфейс и файлы настроек из репозитория
          if [ -d "source/root" ]; then cp -r source/root/* apk_root/ 2>/dev/null || true; fi
          if [ -d "source/luci-app-xray/htdocs" ]; then cp -r source/luci-app-xray/htdocs/* apk_root/www/ 2>/dev/null || true; fi
          if [ -d "source/luci-app-xray/root" ]; then cp -r source/luci-app-xray/root/* apk_root/ 2>/dev/null || true; fi

          # Создаем файл манифеста для apk-менеджера OpenWrt 25.12.5
          cat << EOF > apk_root/.PKGINFO
          pkgname = luci-app-xray
          pkgver = 3.7.1-1
          pkgdesc = LuCI Support for Xray (OpenWrt 25.12 JS Architecture)
          url = https://github.com
          arch = all
          depend = xray-core
          EOF

      - name: Pack APK File
        run: |
          cd apk_root
          # Собираем архив пакета
          tar -czf ../luci-app-xray_3.7.1-1_all.apk .PKGINFO * 2>/dev/null || true

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-pure-js-apk
          path: luci-app-xray_3.7.1-1_all.apk
