name: Build luci-app-xray APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ZSTD Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Setup OpenWrt SDK
        run: |
          wget --tries=10 --retry-connrefused --waitretry=5 -c https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mv openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64 sdk

      - name: Update and Install Feeds
        run: |
          cd sdk
          echo "src-git-full luci_app_xray https://github.com/yichya/luci-app-xray" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Package
        run: |
          cd sdk
          # KCONFIG_NOT_STRICT=1 заставляет конфигуратор проигнорировать баг циклической зависимости Nginx
          KCONFIG_NOT_STRICT=1 make defconfig
          echo "CONFIG_PACKAGE_luci-app-xray=m" >> .config
          KCONFIG_NOT_STRICT=1 make defconfig

      - name: Compile Package
        run: |
          cd sdk
          # Передаем флаг нестрогой конфигурации и в сам процесс компиляции
          KCONFIG_NOT_STRICT=1 make package/luci-app-xray/compile V=s IGNORE_ERRORS=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-apk-x86_64
          path: |
            sdk/bin/packages/x86_64/base/*.apk
            sdk/bin/packages/x86_64/luci/*.apk
          if-no-files-found: error
