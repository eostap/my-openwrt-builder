name: Build luci-app-xray APK (Fast Pack)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download luci-app-xray Source
        run: |
          # Скачиваем исходный код пакета напрямую в виде ZIP-архива, чтобы обойти баг утилиты git clone
          wget https://github.com
          unzip main.zip
          mv luci-app-xray-main source

      - name: Install APK Tools
        run: |
          # Устанавливаем официальную утилиту сборки пакетов Alpine/OpenWrt
          sudo apt-get update
          sudo apt-get install -y abuild apk-tools

      - name: Prepare APK Structure
        run: |
          # Создаем структуру папок для генерации пакета
          mkdir -p apk_root/usr/share/luci/menu.d
          mkdir -p apk_root/usr/share/rpcd/acl.d
          mkdir -p apk_root/www/luci-static/resources/view

          # Копируем JavaScript интерфейс и системные файлы из репозитория yichya
          cp -r source/root/* apk_root/ 2>/dev/null || true
          if [ -d "source/luci-app-xray/htdocs" ]; then cp -r source/luci-app-xray/htdocs/* apk_root/www/ 2>/dev/null || true; fi
          if [ -d "source/luci-app-xray/root" ]; then cp -r source/luci-app-xray/root/* apk_root/ 2>/dev/null || true; fi

          # Создаем файл манифеста PKGINFO, необходимый для менеджера apk в OpenWrt 25.12
          cat << EOF > apk_root/.PKGINFO
          pkgname = luci-app-xray
          pkgver = 3.7.1-1
          pkgdesc = LuCI Support for Xray (OpenWrt 25.12 JS Architecture)
          url = https://github.com/yichya/luci-app-xray
          arch = all
          depend = xray-core
          EOF

      - name: Pack APK File
        run: |
          # Упаковываем все файлы в финальный .apk пакет без цифровой подписи
          cd apk_root
          tar -czf ../luci-app-xray_3.7.1-1_all.apk .PKGINFO * 2>/dev/null || true

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-pure-js-apk
          path: luci-app-xray_3.7.1-1_all.apk
