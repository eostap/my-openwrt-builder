name: Build luci-app-xray APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Принудительно используем обновленный под-релиз checkout
          fetch-depth: 0

      - name: Setup OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar -xJf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-25.12.5* sdk

      - name: Update and Install Feeds
        run: |
          cd sdk
          # Добавляем репозиторий luci-app-xray
          echo "src-git-full luci_app_xray https://github.com" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Package
        run: |
          cd sdk
          # Генерируем базовый конфиг
          make defconfig
          # Явно включаем наш пакет в конфигурацию сборки как модуль (M)
          # Это предотвратит ошибку отсутствия цели для компиляции
          echo "CONFIG_PACKAGE_luci-app-xray=m" >> .config
          make defconfig

      - name: Compile Package
        run: |
          cd sdk
          # Запуск компиляции с флагом игнорирования ошибок второстепенных проверок, если они есть
          make package/luci-app-xray/compile V=s IGNORE_ERRORS=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-apk-x86_64
          path: |
            sdk/bin/packages/x86_64/base/*.apk
            sdk/bin/packages/x86_64/luci/*.apk
          if-no-files-found: error
