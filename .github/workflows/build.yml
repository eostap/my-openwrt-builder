name: Build luci-app-xray APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ZSTD Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Setup OpenWrt SDK
        run: |
          wget --tries=10 --retry-connrefused --waitretry=5 -c https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mv openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64 sdk

      - name: Clone luci-app-xray Safely
        run: |
          # Сначала создаем целевую директорию внутри SDK
          mkdir -p sdk/package/luci-app-xray
          # Клонируем репозиторий из глобального окружения (/usr/bin/git), чтобы SDK не ломал пути
          /usr/bin/git clone --depth 1 https://github.com sdk/package/luci-app-xray

      - name: Update Standard Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Package
        run: |
          cd sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-xray=m" >> .config
          make defconfig

      - name: Compile Package
        run: |
          cd sdk
          make package/luci-app-xray/compile V=s IGNORE_ERRORS=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-apk-x86_64
          path: |
            sdk/bin/packages/x86_64/base/*.apk
            sdk/bin/packages/x86_64/luci/*.apk
            sdk/bin/packages/x86_64/luci_app_xray/*.apk
          if-no-files-found: warn
